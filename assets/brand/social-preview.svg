<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">Desktop Control</title><desc id="desc">See the UI. Verify the outcome. Windows desktop control for Codex. An original focus-bracket and pointer mark on graphite.</desc><rect width="1280" height="640" fill="#10151e"/><g font-family="Segoe UI,Arial,sans-serif"><g transform="translate(64 64) scale(0.5)" fill="none" stroke-linecap="square"><path d="M0 20V0h20 M76 0h20v20 M96 76v20H76 M20 96H0V76" stroke="#8ca7ff" stroke-width="5"/><path d="M26 26h44v44H26z" stroke="#f1f5fc" stroke-width="2"/><path d="m40 34 22 22-13 2-5 12z" fill="#8ca7ff" stroke="#8ca7ff" stroke-width="1"/></g><text x="138" y="100" fill="#f1f5fc" font-size="32" font-weight="600" letter-spacing="1">DESKTOP CONTROL</text><text x="64" y="264" fill="#f1f5fc" font-size="78" font-weight="650" letter-spacing="-2">See the UI.</text><text x="64" y="358" fill="#f1f5fc" font-size="78" font-weight="650" letter-spacing="-2">Verify the outcome.</text><text x="66" y="449" fill="#b5c1d5" font-size="30">Windows desktop control for Codex.</text><path d="M64 516h1152" stroke="#344259"/><text x="66" y="568" fill="#8ca7ff" font-size="24" letter-spacing="2">OBSERVE  /  ACT  /  VERIFY</text><g transform="translate(945 170) scale(2)" fill="none" stroke-linecap="square"><path d="M0 20V0h20 M76 0h20v20 M96 76v20H76 M20 96H0V76" stroke="#8ca7ff" stroke-width="5"/><path d="M26 26h44v44H26z" stroke="#f1f5fc" stroke-width="2"/><path d="m40 34 22 22-13 2-5 12z" fill="#8ca7ff" stroke="#8ca7ff" stroke-width="1"/></g></g></svg>