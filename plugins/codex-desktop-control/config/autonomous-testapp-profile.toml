# Repository-local configuration fragment; it is not a native Codex profile selector.
# Explicit user opt-in is required before merging it into the trusted project's config,
# then starting a fresh Codex session. It relaxes only the state-changing prompts
# required by the controlled TestApp flow; DesktopControl's TestApp allowlist
# remains authoritative. enabled_tools is inherited from the trusted project and
# is intentionally not redefined here.
[plugins."codex-desktop-control@desktop-control-local".mcp_servers.desktop-control]
enabled = true
default_tools_approval_mode = "prompt"

[plugins."codex-desktop-control@desktop-control-local".mcp_servers.desktop-control.tools."desktop.observe"]
approval_mode = "approve"

[plugins."codex-desktop-control@desktop-control-local".mcp_servers.desktop-control.tools."desktop.get_state"]
approval_mode = "approve"

[plugins."codex-desktop-control@desktop-control-local".mcp_servers.desktop-control.tools."desktop.windows"]
