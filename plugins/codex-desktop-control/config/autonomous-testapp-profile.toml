[plugins."codex-desktop-control@desktop-control-local".mcp_servers.desktop-control.tools."desktop.ui_tree"]
approval_mode = "approve"

[plugins."codex-desktop-control@desktop-control-local".mcp_servers.desktop-control.tools."desktop.find_ui"]
approval_mode = "approve"

[plugins."codex-desktop-control@desktop-control-local".mcp_servers.desktop-control.tools."desktop.focus_window"]
